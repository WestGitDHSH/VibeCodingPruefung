<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Client bearbeiten</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

<h1>Client bearbeiten: {{ client["client_id"] }}</h1>

<form method="POST">

<label>Datum:</label>
<input type="text" name="date" value="{{ client['date'] }}">

<label>Ort:</label>
<input type="text" name="location" value="{{ client['location'] }}">

<label>Fachkraft:</label>
<input type="text" name="staff" value="{{ client['staff'] }}">

<label>Fortschritt:</label>
<select name="progress">
    <option value="1" {% if client["progress"] == 1 %}selected{% endif %}>Antrag eingegangen</option>
    <option value="2" {% if client["progress"] == 2 %}selected{% endif %}>Termin vereinbart</option>
    <option value="3" {% if client["progress"] == 3 %}selected{% endif %}>Unterlagen vollständig</option>
    <option value="4" {% if client["progress"] == 4 %}selected{% endif %}>In Bearbeitung</option>
    <option value="5" {% if client["progress"] == 5 %}selected{% endif %}>Abgeschlossen</option>
</select>

<button type="submit">Speichern</button>

</form>

<a href="/termine"><button>Zurück</button></a>

</div>

</body>
</html>
